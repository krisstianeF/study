<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stylized To‑Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <ul class="todo-list">
    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Complete web design project</label>
      <ul class="sub-item">
        <li>
          <a href="https://example.com/design" class="sub-item-link" target="_blank">Design guidelines</a>
        </li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Review code changes</label>
      <ul class="sub-item">
        <li>
          <a href="https://github.com/project" class="sub-item-link" target="_blank">GitHub repository</a>
        </li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Schedule team meeting</label>
      <ul class="sub-item">
        <li>
          <a href="https://calendar.google.com" class="sub-item-link" target="_blank">Google Calendar</a>
        </li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Update documentation</label>
      <ul class="sub-item">
        <li>
          <a href="https://docs.example.com" class="sub-item-link" target="_blank">Project docs</a>
        </li>
      </ul>
    </li>
  </ul>
</body>
</html>
