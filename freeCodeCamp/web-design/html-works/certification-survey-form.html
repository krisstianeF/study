<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
</head>
<body>
  <h1 id="title">Customer Feedback Survey</h1>
  <p id="description">Please fill out this survey to help us improve our services.</p>
  <form id="survey-form">
    <label id="name-label" for="name">Name:</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <label id="email-label" for="email">Email:</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email address"
      required
    >

    <label id="number-label" for="number">Age:</label>
    <input
      type="number"
      id="number"
      min="18"
      max="99"
      placeholder="Enter your age (18–99)"
      required
    >

    <label for="dropdown">How did you hear about us?</label>
    <select id="dropdown">
      <option value="">Select an option</option>
      <option value="search">Search engine</option>
      <option value="social">Social media</option>
      <option value="friend">Friend recommendation</option>
    </select>

    <p>How satisfied are you with our service?</p>
    <label>
      <input type="radio" name="satisfaction" value="very-satisfied" required>
      Very satisfied
    </label>
    <label>
      <input type="radio" name="satisfaction" value="satisfied" required>
      Satisfied
    </label>
    <label>
      <input type="radio" name="satisfaction" value="neutral" required>
      Neutral
    </label>

    <p>What features do you like?</p>
    <label>
      <input type="checkbox" value="feature1">
      Fast delivery
    </label>
    <label>
      <input type="checkbox" value="feature2">
      Good customer support
    </label>
    <label>
      <input type="checkbox" value="feature3">
      Wide product range
    </label>

    <label for="comments">Additional comments:</label>
    <textarea
      id="comments"
      rows="4"
      cols="50"
      placeholder="Share your thoughts and suggestions..."
    ></textarea>

    <button type="submit" id="submit">Submit Survey</button>
  </form>
</body>
</html>
