<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="A scenic view of mountains with a clear blue sky"
    >
    <div class="post-content">
      <h2 class="post-title">Exploring the Beauty of Nature</h2>
      <p class="post-excerpt">
        Join us on a journey through breathtaking landscapes and discover the hidden gems of nature.
        From majestic mountains to serene lakes, experience the tranquility that only nature can offer.
      </p>
      <a class="read-more" href="#">Read More</a>
    </div>
  </div>
</body>
</html>
